<title>PromptJuice Launch Film</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One deliberate dark look: the film's own near-black stage. */
  :root { color-scheme: dark; --page: #0b0c10; --panel: rgba(20,22,28,.92); --text: #dddfe4; --accent: #5fd11f; --accent-ink: #08130a; }
  @font-face { font-family: "PJ Text"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "PJ Text"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "PJ Text"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "PJ Display"; src: url("assets/fonts/InterDisplay-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "PJ Display"; src: url("assets/fonts/InterDisplay-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "PJ Display"; src: url("assets/fonts/InterDisplay-Bold.otf"); font-weight: 700; }

  :root {
    --green: #5fd11f; --amber: #f0a32a; --claude: #ff9f0a; --codex: #32d4de;
    --ink: #07080b; --white: #ffffff;
  }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--text); overflow: hidden; }
  body.preview { display: grid; place-items: center; min-height: 100%; background: var(--page); color: var(--text); font-family: "PJ Text", system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 84px; box-sizing: border-box; }
  #viewport { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
  body.preview #viewport { box-shadow: 0 30px 90px rgba(0,0,0,.6); border-radius: 10px; overflow: hidden; }

  #film { position: absolute; inset: 0; overflow: hidden; background: var(--ink); font-family: "PJ Text", sans-serif; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #glow { position: absolute; left: 50%; top: 50%; width: 2200px; height: 2200px; margin: -1100px 0 0 -1100px; border-radius: 50%; }
  #vignette { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
  #grain { opacity: .05; mix-blend-mode: overlay; }
  canvas.fx { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #flash { position: absolute; inset: 0; opacity: 0; }

  /* Mascot rig */
  .mascot { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
  .mascot img { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .mascot .top { position: absolute; inset: 0; }
  .shadow { position: absolute; left: 0; top: 0; width: 100px; height: 24px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0)); }
  .bang { position: absolute; left: 0; top: 0; font: 700 120px/1 "PJ Display"; color: var(--amber); text-shadow: 0 0 30px rgba(240,163,42,.6); }

  /* Type */
  .title { position: absolute; white-space: nowrap; font: 700 112px/1.05 "PJ Display"; letter-spacing: -0.035em; color: #fff; }
  .title .w { display: inline-block; will-change: auto; }
  .title .amber { color: var(--amber); }
  .title .green { color: var(--green); }
  .caption { position: absolute; white-space: nowrap; font: 600 56px/1 "PJ Text"; letter-spacing: -0.015em; }

  /* Big zip bar */
  .bigbar { position: absolute; }
  .bigbar .track { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .bigbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .bigbar .fill::after { content: ""; position: absolute; left: 10px; right: 10px; top: 18%; height: 22%; border-radius: 999px; background: rgba(255,255,255,.35); filter: blur(2px); }
  .bigbar .head { position: absolute; top: 50%; width: 120px; height: 200%; margin-top: -100%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,1), rgba(255,255,255,.55) 35%, rgba(255,255,255,0)); mix-blend-mode: screen; }
  .bigbar .streak { position: absolute; left: 0; height: 4px; border-radius: 4px; }
  .bigbar .glint { position: absolute; top: -10%; bottom: -10%; width: 70px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9), rgba(255,255,255,0)); mix-blend-mode: screen; border-radius: 30px; }

  /* Juicebar panel (1px = 1pt) */
  #panelStage { perspective: 2600px; perspective-origin: 960px 540px; }
  #panelCam { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .pj-panel { position: absolute; left: 0; top: 0; width: 384px; border-radius: 22px; transform-origin: 50% 0; color: #fff; font-family: "PJ Text"; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.4); }
  .pj-mat { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(180deg, #1d2129 0%, #14171e 45%, #0b0d13 100%); }
  .pj-sheen { position: absolute; inset: 0; border-radius: 22px; background: radial-gradient(circle at 0 0, rgba(255,255,255,.14), rgba(255,255,255,.045) 40%, rgba(255,255,255,0) 70%); mix-blend-mode: screen; }
  .pj-stroke { position: absolute; inset: 0; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 1px 1px 0 0 rgba(255,255,255,.22); }
  .pj-header { position: absolute; left: 18px; right: 18px; top: 14px; height: 32px; display: flex; align-items: center; gap: 11px; }
  .pj-hcircle { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(240,163,42,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 10px rgba(240,163,42,.16); }
  .pj-htext { flex: 1; min-width: 0; }
  .pj-title { font: 600 14px/17px "PJ Text"; color: #fff; letter-spacing: -0.01em; }
  .pj-sub { font: 500 11px/13px "PJ Text"; color: rgba(255,255,255,.58); margin-top: 2px; }
  .pj-close { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
  .pj-card { position: absolute; left: 14px; right: 14px; border-radius: 14px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.075); overflow: hidden; transform-origin: 50% 0; }
  .pj-cardhdr { position: absolute; left: 12px; right: 12px; top: 12px; height: 16px; display: flex; align-items: center; gap: 8px; }
  .pj-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pj-name { font: 600 13px/16px "PJ Text"; color: rgba(255,255,255,.92); flex: 1; letter-spacing: -0.01em; }
  .pj-chevron { width: 16px; height: 16px; }
  .pj-cardbody { position: absolute; left: 12px; right: 12px; top: 38px; }
  .pj-row { position: absolute; left: 0; right: 0; transform-origin: 50% 0; }
  .pj-line { position: relative; height: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .pj-label { font: 500 11px/16px "PJ Text"; color: rgba(255,255,255,.55); }
  .pj-right { display: flex; align-items: baseline; gap: 5px; font-feature-settings: "tnum"; white-space: nowrap; }
  .pj-pct { font: 600 12.5px/16px "PJ Text"; color: rgba(255,255,255,.9); letter-spacing: -0.01em; }
  .pj-sep { font: 400 11px/16px "PJ Text"; color: rgba(255,255,255,.3); }
  .pj-reset { font: 500 11px/16px "PJ Text"; color: rgba(255,255,255,.55); }
  .pj-reset.useSoon { color: var(--amber); }
  .pj-bar { position: absolute; }
  .pj-track { position: absolute; inset: 0; border-radius: 9px; background: rgba(255,255,255,.07); }
  .pj-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; }
  .pj-fill.healthy { background: rgba(95,209,31,.42); }
  .pj-fill.healthy.main { background: linear-gradient(90deg, #3fa512 0%, #5fd11f 62%, #8be24e 100%); box-shadow: 0 0 5px rgba(95,209,31,.38); }
  .pj-fill.useSoon { background: linear-gradient(90deg, #d9880f 0%, #f0a32a 58%, #ffc15e 100%); box-shadow: 0 0 3px rgba(240,163,42,.42); }
  .pj-fill.useSoon.main { box-shadow: 0 0 6px rgba(240,163,42,.42); }
  .pj-head { position: absolute; top: 50%; left: 0; width: 28px; height: 14px; margin-top: -7px; border-radius: 50%; background: radial-gradient(closest-side, #fff, rgba(255,255,255,.4) 45%, rgba(255,255,255,0)); mix-blend-mode: screen; }
  .pj-streaks { position: absolute; left: 0; top: 50%; }
  .pj-streak { position: absolute; left: 0; top: 0; height: 1px; border-radius: 1px; }
  .pj-streak.healthy { background: linear-gradient(90deg, rgba(139,226,78,0), rgba(190,255,140,.95)); }
  .pj-streak.useSoon { background: linear-gradient(90deg, rgba(240,163,42,0), rgba(255,215,140,.95)); }
  .pj-glint { position: absolute; top: -2px; bottom: -2px; left: 0; width: 18px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95), rgba(255,255,255,0)); mix-blend-mode: screen; }

  /* Menu bar (pt units, scaled) */
  #menubar { position: absolute; left: 0; top: 0; width: 800px; height: 24px; transform-origin: 0 0; background: linear-gradient(90deg, rgba(34,36,42,0), rgba(34,36,42,.92) 22%, rgba(34,36,42,.92)); box-shadow: inset 0 -1px 0 rgba(255,255,255,.06); }
  #menubar .item { position: absolute; top: 0; height: 24px; display: grid; place-items: center; }
  #menubar .hl { position: absolute; top: 2px; height: 20px; border-radius: 5px; background: rgba(255,255,255,.16); }
  #menubar .clock { white-space: nowrap; font: 500 13px/24px "PJ Text"; color: rgba(255,255,255,.92); letter-spacing: -0.01em; }

  /* Legend + tasks + end card */
  .legend { position: absolute; display: flex; align-items: center; gap: 26px; font: 700 64px/1 "PJ Display"; letter-spacing: -0.03em; white-space: nowrap; }
  .legend img { height: 132px; }
  .legend > div { display: flex; flex-direction: column; gap: 12px; }
  .legend .who { display: flex; align-items: center; gap: 12px; font: 600 36px/1 "PJ Text"; color: rgba(255,255,255,.72); letter-spacing: -0.01em; }
  .legend .who i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .task { position: absolute; width: 440px; height: 176px; border-radius: 30px; background: linear-gradient(180deg, rgba(36,39,47,.98), rgba(20,22,28,.98)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.09), inset 2px 2px 0 rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.5); padding: 30px 34px; box-sizing: border-box; transform-origin: 50% 50%; }
  .task .who { display: flex; align-items: center; gap: 14px; font: 600 30px/1 "PJ Text"; color: rgba(255,255,255,.62); }
  .task .who i { width: 14px; height: 14px; border-radius: 50%; background: var(--claude); display: block; }
  .task .what { margin-top: 20px; white-space: nowrap; overflow: hidden; font: 700 42px/1.1 "PJ Display"; letter-spacing: -0.025em; color: #fff; }
  .task .chip { position: absolute; right: 30px; top: 24px; font: 700 24px/1 "PJ Text"; padding: 10px 16px; border-radius: 999px; color: var(--amber); background: rgba(240,163,42,.14); box-shadow: inset 0 0 0 2px rgba(240,163,42,.35); }
  .task .prog { position: absolute; left: 34px; right: 34px; bottom: 26px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; }
  .task .prog b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, #d9880f, #ffc15e); }
  #stream { position: absolute; inset: 0; overflow: visible; }
  .wordmark { position: absolute; font: 700 150px/1 "PJ Display"; letter-spacing: -0.045em; white-space: nowrap; }
  .url { position: absolute; font: 600 54px/1 "PJ Text"; letter-spacing: -0.01em; color: rgba(255,255,255,.72); white-space: nowrap; }
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 68px; transform-origin: 6px 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }

  /* Preview chrome */
  #controls { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: none; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 14px; background: var(--panel); box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); color: #ddd; font: 500 13px/1 "PJ Text"; z-index: 10; }
  body.preview #controls { display: flex; }
  #controls button { appearance: none; border: 0; border-radius: 9px; padding: 8px 14px; background: var(--accent); color: var(--accent-ink); font: 700 13px/1 "PJ Text"; cursor: pointer; }
  #controls input[type=range] { width: min(56vw, 720px); accent-color: var(--accent); }
  #controls button:focus-visible, #controls input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #controls .time { font-feature-settings: "tnum"; min-width: 92px; text-align: right; }
  @media (max-width: 700px) { #controls { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); transform: none; } #controls input[type=range] { width: 100%; } }
</style>
<div id="viewport"><div id="film"></div></div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="24.9" step="0.0333" value="0">
  <span class="time" id="time">0.00 s</span>
  <label><input id="mute" type="checkbox"> Mute</label>
</div>
<audio id="soundtrack" src="dist/soundtrack.mp3" preload="auto"></audio>
<script src="dist/film.js"></script>
